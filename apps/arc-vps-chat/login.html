<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sign in to Arc</title><style>body{font:16px system-ui;background:#101916;color:#edf5ef;display:grid;place-items:center;min-height:90vh}main{max-width:28rem;padding:2rem;border:1px solid #375247;border-radius:1rem;background:#192820}button,a{display:block;margin:1rem 0;padding:.8rem;border-radius:.5rem}button{background:#9ce8c1;border:0;font:inherit;cursor:pointer}a{color:#9ce8c1}</style></head><body><main><h1>Sign in to Arc</h1><p>Use a passkey already registered with this Arc account.</p><button id="sign-in">Use passkey</button><a href="/arko/chat">Use existing password</a><p id="result" role="status"></p></main><script>
const decode64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const encode64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('sign-in').onclick=async()=>{const msg=document.getElementById('result');try{const r=await fetch('/arko/chat/api/passkeys/login/options',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Passkey sign-in is unavailable');const data=await r.json();const o=data.options;o.challenge=decode64(o.challenge);o.allowCredentials=(o.allowCredentials||[]).map(c=>({...c,id:decode64(c.id)}));const c=await navigator.credentials.get({publicKey:o});if(!c)throw Error('Sign-in cancelled');const response=c.response;const credential={id:c.id,rawId:encode64(c.rawId),type:c.type,response:{clientDataJSON:encode64(response.clientDataJSON),authenticatorData:encode64(response.authenticatorData),signature:encode64(response.signature),userHandle:response.userHandle?encode64(response.userHandle):null},clientExtensionResults:c.getClientExtensionResults()};const v=await fetch('/arko/chat/api/passkeys/login/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:data.id,credential})});if(!v.ok)throw Error('Passkey sign-in failed');location.href='/arko/chat'}catch(e){msg.textContent=e.message}};
</script></body></html>
